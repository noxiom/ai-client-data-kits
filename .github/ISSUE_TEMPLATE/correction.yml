name: Correction
description: Something in a kit or the guide is wrong or out of date
title: "Correction: "
labels: ["correction"]
body:
  - type: markdown
    attributes:
      value: |
        **Never post client data, names, or details of a real incident here.** This issue is public. The kits never need that information, and neither do we.
  - type: input
    id: where
    attributes:
      label: Where
      description: The page, file or fact (for example, "/claude-personal-vs-team, retention for Team").
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is wrong, and what should it say
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: A link to the vendor's or regulator's own page that shows the correct information.
    validations:
      required: true
